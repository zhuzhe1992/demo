# ============================================================
# 根 pyproject.toml — 仅用于开发工具配置，不发布到 PyPI
# ============================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-monorepo"
version = "0.0.0"
description = "Demo Python monorepo"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "hatchling>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
