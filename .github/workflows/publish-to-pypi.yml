# ============================================================
# GitHub Actions: 自动构建并发布 Python 包到 PyPI
# 支持单包和 Monorepo（多包）发布
# 认证方式: PyPI Trusted Publishers (OIDC) — 无需 API Token
# ============================================================
#
# --- 触发条件 ---
#
# 1. 打 tag 时触发（推荐）:
#    git tag pkg-core-v0.1.0 && git push --tags
#    tag 命名规则: <package-dir-name>-v<semver>
#    例如: pkg-core-v0.1.0  → 发布 packages/pkg_core
#         pkg-utils-v0.2.0  → 发布 packages/pkg_utils
#
# 2. 手动触发 (workflow_dispatch): 可在 GitHub Actions 页面手动选择包发布
#

name: Publish to PyPI

on:
  push:
    tags:
      # 匹配格式: <package-slug>-v1.2.3
      - "**-v[0-9]+.[0-9]+.[0-9]+**"
  workflow_dispatch:
    inputs:
      package-directory:
        description: "要发布的包目录名（位于 packages/ 下）"
        required: true
        type: choice
        options:
          - pkg_core
          - pkg_utils

permissions:
  id-token: write   # OIDC Trusted Publishers 必需
  contents: read    # 读取仓库代码

jobs:
  # ------------------------------------------------------------------
  # Job 1: 解析 tag 或手动输入，确定要发布的包目录
  # ------------------------------------------------------------------
  detect-package:
    runs-on: ubuntu-latest
    outputs:
      package-dir: ${{ steps.resolve.outputs.package-dir }}
      package-slug: ${{ steps.resolve.outputs.package-slug }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve package directory from tag or manual input
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PACKAGE_DIR="${{ github.event.inputs.package-directory }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE_SLUG="${TAG_NAME%-v*}"
            PACKAGE_DIR=$(echo "$PACKAGE_SLUG" | tr '-' '_')
          fi

          if [ ! -d "packages/$PACKAGE_DIR" ]; then
            echo "❌ 目录 packages/$PACKAGE_DIR 不存在"
            echo "可用的包目录:"
            ls -d packages/*/ 2>/dev/null || echo "  (无)"
            exit 1
          fi

          echo "package-dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          PACKAGE_SLUG=$(echo "$PACKAGE_DIR" | tr '_' '-')
          echo "package-slug=$PACKAGE_SLUG" >> "$GITHUB_OUTPUT"
          echo "📦 将发布包: packages/$PACKAGE_DIR"

  # ------------------------------------------------------------------
  # Job 2: 构建包
  # ------------------------------------------------------------------
  build:
    needs: detect-package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          cd "packages/${{ needs.detect-package.outputs.package-dir }}"
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.detect-package.outputs.package-dir }}
          path: packages/${{ needs.detect-package.outputs.package-dir }}/dist/
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3: 发布到 TestPyPI
  # ------------------------------------------------------------------
  publish-testpypi:
    needs: [detect-package, build]
    runs-on: ubuntu-latest
    environment: testpypi

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.detect-package.outputs.package-dir }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ------------------------------------------------------------------
  # Job 4: 发布到 PyPI（TestPyPI 成功后）
  # ------------------------------------------------------------------
  publish-pypi:
    needs: [detect-package, build, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.detect-package.outputs.package-dir }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
