[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkg-core-zhuzhe-test"
version = "0.1.0"
description = "Demo monorepo - core package"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "zhuzhe", email = "zhuzhe@example.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pkg_core"]